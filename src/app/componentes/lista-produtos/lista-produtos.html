<section class="secao-produtos">

    <h2>Catálogo de Produtos</h2>
    @if(carregando){
        <p class="mensagem-c    arregando">Carregando vitrine de produtos...</p>
        }
        
        @else{
        <div class="cards-grid">
            @for(item of produtos; track item.id){
                <app-card-produto [produto]="item" (adicionar)="receberProduto($event)"></app-card-produto>
            }
        </div>
        }
</section>
